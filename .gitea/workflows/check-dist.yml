# The action runs from the committed dist/ bundle. Rebuild it from src/ and
# fail when the committed bundle is out of date (forgotten `npm run package`).
name: check-dist

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-dist:
    runs-on: ubuntu-latest
    steps:
      - uses: https://github.com/actions/checkout@v7

      - uses: https://github.com/actions/setup-node@v7
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Rebuild dist
        run: npm run package

      - name: Compare committed dist against rebuild
        run: git diff --exit-code -- dist/
